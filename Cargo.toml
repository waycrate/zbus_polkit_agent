[package]
name = "zbus-polkit-agent"
version = "0.4.3"
edition = "2024"
license = "GPL-3.0-or-later"
keywords = ["zbus", "polkit"]
description = "polkit-agent binding for zbus"
authors = ["Decodertalkers <aakari@tutanota.com>"]
repository = "https://github.com/waycrate/zbus_polkit_agent"

[dependencies]
nix = { version = "0.31.3", features = ["process", "user"] }

serde = { version = "1.0.229", features = ["derive"] }
systemd = "0.10.1"
libsystemd-sys = "0.9.4"
thiserror = "2.0.20"
zbus = "5.19.0"
zbus_polkit = "5.1.0"

[dev-dependencies]
rpassword = "7.5.4"
tokio = { version = "1.53.1", features = ["full"] }

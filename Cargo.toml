[package]
name = "zbus-polkit-agent"
version = "0.4.3"
edition = "2024"
license = "GPL-3.0-or-later"
keywords = ["zbus", "polkit"]
description = "polkit-agent binding for zbus"
authors = ["Decodertalkers <aakari@tutanota.com>"]
repository = "https://github.com/waycrate/zbus_polkit_agent"

[dependencies]
nix = { version = "0.31.3", features = ["process", "user"] }

serde = { version = "1.0.229", features = ["derive"] }
systemd = "0.11.1"
thiserror = "2.0.21"
zbus = "6.0.0"
zbus_polkit = { git = "https://github.com/z-galaxy/zbus_polkit" }

[dev-dependencies]
rpassword = "7.5.4"
tokio = { version = "1.54.1", features = ["full"] }
